name: Build LiquidGlassLauncher APK

on:
  push:
    branches: [ main, Main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tự động tìm thư mục dự án và biên dịch APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          echo "Đã tìm thấy dự án tại: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Xuất file APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
