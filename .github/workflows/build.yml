name: Build LiquidGlassLauncher APK

on:
  push:
    branches: [ Main, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Biên dịch file APK
        run: gradle assembleDebug

      - name: Xuất file APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
